<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>KS Analytics – Connecting TikTok…</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:48px auto;padding:0 16px;color:#1F2A44;line-height:1.5}
  .btn{display:inline-block;background:#000;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:bold}
  .err{color:#B00020}
</style>
</head>
<body>
<h2>KS Analytics – TikTok</h2>
<p id="msg">Finishing the TikTok connection…</p>
<p id="go" style="display:none"><a id="link" class="btn" href="#">Continue to KS Analytics</a></p>
<noscript><p class="err">Please enable JavaScript to finish connecting TikTok.</p></noscript>
<script>
(function () {
  // TikTok Login Kit redirects here with ?code=&scopes=&state= (or ?error=&error_description=&state=).
  // state = base64url(JSON {n: nonce, u: Apps Script /exec URL}), created by the KS sheet script.
  // This page only forwards those values to that Apps Script web app; it never stores or uses them.
  var msg = document.getElementById('msg');
  function fail(t) { msg.className = 'err'; msg.textContent = t; }
  var q = new URLSearchParams(window.location.search);
  var state = q.get('state') || '';
  if (!state) { fail('Missing state. Start again from the sheet: 🎶 KS Sync › Connect TikTok.'); return; }
  var target = '';
  try {
    var b64 = state.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var obj = JSON.parse(atob(b64));
    target = String(obj.u || '');
  } catch (e) { fail('Invalid state. Start again from the sheet: 🎶 KS Sync › Connect TikTok.'); return; }
  // Only forward to a Google Apps Script web app (/exec) URL.
  var ok = false;
  try {
    var t = new URL(target);
    ok = t.protocol === 'https:' && t.hostname === 'script.google.com' &&
         /^\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(t.pathname) &&
         target.indexOf('https://script.google.com/') === 0;
  } catch (e2) { ok = false; }
  if (!ok) { fail('Unexpected destination – connection stopped for safety.'); return; }
  var out = new URLSearchParams();
  ['code', 'scopes', 'state', 'error', 'error_description'].forEach(function (k) {
    var v = q.get(k);
    if (v !== null) out.set(k, v);
  });
  var url = target + '?' + out.toString();
  var link = document.getElementById('link');
  link.href = url;
  document.getElementById('go').style.display = 'block';
  msg.textContent = q.get('error') ? 'TikTok returned an error – sending it to KS Analytics…' : 'Connected to TikTok – sending you to KS Analytics…';
  // Remove code from the address bar/history, then forward.
  try { window.history.replaceState(null, '', window.location.pathname); } catch (e3) {}
  window.location.replace(url);
})();
</script>
</body>
</html>
